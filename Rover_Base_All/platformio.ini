board = upesy_wroom
framework = arduino
monitor_speed = 115200
lib_deps = 
	olikraus/U8g2@^2.36.15
	adafruit/Adafruit_VL53L0X@^1.2.4
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
